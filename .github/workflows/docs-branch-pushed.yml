name: docs-branch-pushed

# Announces a `docs/*` branch pushed here from an application's private
# repository, and hands over a one-click link to open the pull request.
#
# **It deliberately does not open the pull request itself.** Doing that needs
# "Allow GitHub Actions to create and approve pull requests", which also lets
# a workflow *approve* one — a workflow that can propose and approve its
# own change is exactly the review this whole arrangement exists to preserve.
# Trading that for one click is a bad trade.
#
# So: the private side prepares a branch containing exactly the allow-listed
# files, this reports it, and a person opens and merges it. Every step a
# machine can safely do is automated; the one that decides what becomes
# public is not.
on:
  push:
    branches: ['docs/**']

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Say what arrived and how to propose it
        env:
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          {
            echo "## Docs branch ready for review"
            echo
            echo "\`$BRANCH\` was pushed from an application's private"
            echo "repository. Nothing is public until you merge it."
            echo
            echo "**[Open the pull request](https://github.com/$REPO/compare/main...$BRANCH?expand=1)**"
            echo
            echo "### Files it changes"
            echo
            echo '```'
            git diff --stat origin/main..HEAD || git diff --stat HEAD~1..HEAD || true
            echo '```'
            echo
            echo "If anything here is unexpected, do not merge it — the"
            echo "publishing workflow's allow-list is wrong, and that is the"
            echo "bug to fix."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Branch $BRANCH is ready. Open a pull request from it when you are happy:"
          echo "  https://github.com/$REPO/compare/main...$BRANCH?expand=1"
